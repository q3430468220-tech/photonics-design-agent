[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photonics-design-agent"
version = "0.2.0"
description = "PRISM-Min: a minimal, attribution-capable LLM agent loop for photonic device design (predict -> simulate -> decompose -> keep/revert)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YongJie Wang" }]
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
    "requests>=2.28",
]

[project.optional-dependencies]
lumerical = []          # lumapi ships with Lumerical; set LUMERICAL_ROOT instead of pip-installing
gds = ["gdsfactory>=8"]
dev = ["pytest>=7"]

[project.scripts]
prism = "prism_min.cli:main"

[tool.setuptools.packages.find]
include = ["prism_min*"]
